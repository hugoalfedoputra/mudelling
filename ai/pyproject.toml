[project]
name = "ai"
version = "1.0.0"
description = "AI training code"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "matplotlib>=3.10.9",
    "mlflow>=1.27.0",
    "pandas>=3.0.3",
    "protobuf<5",
    "python-dotenv>=1.2.2",
    "rclone-python>=0.1.24",
    "scikit-learn>=1.8.0",
    "scipy",
    "seaborn",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = ["ipykernel>=7.2.0"]

[project.optional-dependencies]
cpu = ["torch>=2.12.0", "torchvision>=0.27.0", "torchinfo>=1.8.0"]
cu132 = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "torchinfo>=1.8.0",
    "fbgemm-gpu; sys_platform == 'linux'",
    "pytorch-triton; sys_platform == 'linux'",
]
cu126 = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "torchinfo>=1.8.0",
    "fbgemm-gpu; sys_platform == 'linux'",
    "pytorch-triton; sys_platform == 'linux'",
]
rocm72 = [
    "torch>=2.12.0; sys_platform == 'linux'",
    "torchvision>=0.27.0; sys_platform == 'linux'",
    "torchinfo>=1.8.0; sys_platform == 'linux'",
    "fbgemm-gpu; sys_platform == 'linux'",
    "triton-rocm; sys_platform == 'linux'",
    "pytorch-triton-rocm; sys_platform == 'linux'",
]
apu72 = [
    # Using 2.9.0 as the floor because AMD's specialized Ryzen fork is currently 2.9.1
    # Pin below 2.10 to avoid AMD's incomplete nightly builds missing Python 3.12 wheels
    "torch>=2.9.0,<2.10.0; sys_platform == 'linux'",
    "torchvision>=0.24.0; sys_platform == 'linux'",
    "torchinfo>=1.8.0; sys_platform == 'linux'",
    "triton>=3.5.0; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu132" },
        { extra = "cu126" },
        { extra = "rocm72" },
        { extra = "apu72" },
    ],
]

environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-rocm72", extra = "rocm72" },
    { index = "pytorch-apu72", extra = "apu72" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-rocm72", extra = "rocm72" },
    { index = "pytorch-apu72", extra = "apu72" },
]
fbgemm-gpu = [
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-rocm72", extra = "rocm72" },
]
triton-rocm = [{ index = "pytorch-rocm72", extra = "rocm72" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm72", extra = "rocm72" }]
pytorch-triton = [
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-cu126", extra = "cu126" },
]
triton = [{ index = "pytorch-apu72", extra = "apu72" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-apu72"
url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/"
format = "flat"
explicit = true
